version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - nas_storage:/nas/cases
    environment:
      - NAS_BASE_PATH=/nas/cases
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: docplatform
      POSTGRES_PASSWORD: docplatform
      POSTGRES_DB: docplatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nas_storage:
