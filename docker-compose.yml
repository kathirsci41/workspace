version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: docplatform
      POSTGRES_PASSWORD: docplatform
      POSTGRES_DB: docplatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://docplatform:docplatform@db:5432/docplatform
      NAS_BASE_PATH: /nas/cases
      OCR_BACKEND: ${OCR_BACKEND:-ollama}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr-service:11434}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-glm-ocr}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-120}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-3}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-3}
    volumes:
      - nas_storage:/nas/cases
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ocr-service:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- Phase 2: OCR Service (Ollama with GLM-OCR) ---
  ocr-service:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Auto-pull the model on startup
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull glm-ocr
        wait

volumes:
  postgres_data:
  nas_storage:
  ollama_models:
