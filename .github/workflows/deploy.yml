name: Deploy to Staging

on:
  push:
    branches: ["DPP-2.3.0"]

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging.pem
          chmod 600 ~/.ssh/staging.pem
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to VM
        run: |
          rsync -avz \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/venv' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/staging.pem" \
            ./ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/home/azureuser/app/

      - name: Write .env and deploy
        run: |
          ssh -i ~/.ssh/staging.pem ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /home/azureuser/app
            cat > .env << 'ENDENV'
          ${{ secrets.STAGING_ENV }}
          ENDENV
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
          ENDSSH
